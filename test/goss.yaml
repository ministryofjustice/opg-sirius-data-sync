  # Check AWS CLI is Installed
  /usr/bin/aws:
    exists: true
    path: /usr/bin/aws
    mode: "0755"
  # Check cURL is Installed
  /usr/bin/curl:
    exists: true
    path: /usr/bin/curl
    mode: "0755"
  # Check jq is Installed
  /usr/bin/jq:
    exists: true
    path: /usr/bin/jq
    mode: "0755"
  # Check pg_dump is Installed
  /usr/bin/pg_dump:
    exists: true
    path: /usr/bin/pg_dump
    mode: "0777"
command:
  # Check Binaries Run
  'aws --version':
    exit-status: 0
    exec: "aws --version"
  'curl --version':
    exit-status: 0
    exec: "curl --version"
  'jq --version':
    exit-status: 0
    exec: "jq --version"
  'pg_dump --version':
    exit-status: 0
    exec: "pg_dump --version"
  # Check Python Deps
  'python3 --version':
    exit-status: 0
    exec: "python3 --version"
  'pip3 list | grep boto3':
    exit-status: 0
    exec: "pip3 list | grep boto3"
  'pip3 list | grep psycopg2':
    exit-status: 0
    exec: "pip3 list | grep psycopg2"
  'pip3 list | grep requests':
    exit-status: 0
    exec: "pip3 list | grep requests"
  'pip3 list | grep requests-aws4auth':
    exit-status: 0
    exec: "pip3 list | grep requests-aws4auth"
  'python3 -c "import psycopg2"':
    exit-status: 0
    exec: 'python3 -c "import psycopg2"'

