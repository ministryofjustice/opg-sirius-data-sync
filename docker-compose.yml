---
services:
  data-sync:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/data-sync:latest
    build:
      context: .
    read_only: true
    tmpfs:
      - /tmp:size=67108864
    volumes:
      - ./test/goss.yaml:/app/goss.yaml
      - goss-bin:/goss-bin:ro

  goss:
    image: ghcr.io/goss-org/goss@sha256:8d3924f722a04a660e9e6c2403be0399d737c0187fc065714d26b992286c3f0a
    volumes:
      - goss-bin:/usr/bin/

  postgresql:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: opgadmin
      POSTGRES_PASSWORD: NotARealPassword123
    healthcheck:
      test: pg_isready --username=opgadmin --dbname=api
      interval: 10s
      timeout: 5s
      retries: 5

  create-database:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/data-sync:latest
    privileged: false
    user: data-sync-user
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGPASSWORD: NotARealPassword123
      PGUSER: opgadmin
    volumes:
      - ./test/setup_sirius_db.sql:/tmp/setup_sirius_db.sql
    command: psql --file=/tmp/setup_sirius_db.sql

  create-roles:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/data-sync:latest
    privileged: false
    user: data-sync-user
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGPASSWORD: NotARealPassword123
      PGUSER: opgadmin
      DATABASE_NAME: api
      ASSIGNEES_ACCESS_PASSWORD: NotARealAssigneesAccessPassword123
      DATA_ACCESS_PASSWORD: NotARealDataAccessPassword123
      SEARCH_APP_USER_PASSWORD: NotARealSearchPassword123
      SIRIUS_APP_USER_PASSWORD: NotARealSiriusPassword123
      SUPERVISION_FINANCE_APP_USER_PASSWORD: NotARealFinancePassword123
      SUPERVISION_FINANCE_ADMIN_APP_USER_PASSWORD: NotARealFinanceAdminPassword123
      OPERATOR_PASSWORD: NotARealOperatorPassword123
    command: /app/create-roles.sh

  dms-setup:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/data-sync:latest
    privileged: false
    user: data-sync-user
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGPASSWORD: NotARealPassword123
      PGUSER: opgadmin
      DATABASE_NAME: api
      DMS_ADMIN_PASSWORD: NotARealAssigneesAccessPassword123
    command: /app/dms-setup.sh


  database-tuning:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/data-sync:latest
    privileged: false
    user: data-sync-user
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGPASSWORD: NotARealPassword123
      PGUSER: opgadmin
      DATABASE_NAME: api
    command: /app/database-tuning.sh

volumes:
  goss-bin:
